
spring.application.name=gridweaver
spring.datasource.url=jdbc:mysql://localhost:3306/gridweaver
spring.datasource.username=root
spring.datasource.password=Teju@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
# Kafka Server
spring.kafka.bootstrap-servers=localhost:9092



# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=gridweaver-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# ==========================================
# JWT
# ==========================================
jwt.secret=GridWeaverSecretKey12345678912345678901234567890
jwt.expiration=36000000

# ==========================================
# Logging (Optional)
# ==========================================

logging.level.org.springframework.security=DEBUG
